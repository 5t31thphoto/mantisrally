; ============================================================
;  Mantis Rally — M5Stack Core2 (Arduino + M5Unified)
;  a rally car through stages that dream themselves
; ============================================================
[env:m5stack-core2]
platform = espressif32@6.9.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = default.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
; MP_LCD_MHZ: the LCD write clock. 80 corrupts the picture on this Core2; 40 is clean.
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DMP_LCD_MHZ=40
; our hot loops run faster at -O2; the framework and libraries keep -Os so the app stays small
build_src_flags =
    -O2
    -fno-math-errno
; everything pinned to MantisPlanet's working build (same platform, framework and libraries on the same Core2)
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
lib_deps =
    m5stack/M5Unified@0.2.26
    m5stack/M5GFX@0.2.33
monitor_filters = esp32_exception_decoder
extra_scripts = post:merge_bin.py
