name: Build & Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Unzip payload into repo, consume zip, commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -name '*.zip' | sort)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "No root zip — building tree as-is"
          else
            for z in "${ZIPS[@]}"; do
              echo "EXTRACT $z"
              TMP=$(mktemp -d)
              unzip -o "$z" -d "$TMP"
              NDIR=$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | wc -l)
              NFILE=$(find "$TMP" -mindepth 1 -maxdepth 1 -type f | wc -l)
              TOP=$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | head -1 || true)
              if [ "$NDIR" -eq 1 ] && [ "$NFILE" -eq 0 ] && [ -n "$TOP" ]; then SRCDIR="$TOP"; else SRCDIR="$TMP"; fi
              if [ -d "$SRCDIR/src" ]; then rm -rf src; fi
              cp -a "$SRCDIR"/. .
              rm -rf "$TMP"
              rm -f "$z"
            done
            git add -A
            if ! git diff --staged --quiet; then
              git commit -m "ci: extract payload into repo (consume zip) [skip ci]"
              git push origin HEAD:${{ github.ref_name }}
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11.17'

      - name: Host gameplay regression test
        run: |
          g++ -O2 -DHOST -I src -I tools/host/stubs tools/host/gameplay_test.cpp \
            src/universe.cpp src/journey.cpp src/terrain.cpp -lm -o /tmp/gameplay_test
          /tmp/gameplay_test

      - name: Install PlatformIO
        run: pip install platformio==6.1.18 esptool==5.6.0

      - name: Build firmware
        run: pio run -e m5stack-core2

      - name: Stage website firmware
        run: |
          set -euo pipefail
          mkdir -p website/firmware
          if [ -f firmware_merged.bin ]; then
            cp -f firmware_merged.bin website/firmware/firmware-merged.bin
          else
            cp -f .pio/build/m5stack-core2/firmware.bin website/firmware/firmware-merged.bin
          fi
          ls -la website/firmware/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5

      - name: Site URL
        run: |
          echo "Live at: ${{ steps.deployment.outputs.page_url }}"
          echo "### Live at ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
